name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to verify and publish; empty for ordinary CI.
        type: string
        default: ''
      marketplace_channel:
        description: JetBrains Marketplace channel for a release.
        type: string
        default: default
    secrets:
      PUBLISH_TOKEN:
        required: false
      CERTIFICATE_CHAIN:
        required: false
      PRIVATE_KEY:
        required: false
      PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check publishing credentials
        if: inputs.release_tag != ''
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo '::error::Add the PUBLISH_TOKEN repository secret in Settings > Secrets and variables > Actions.'
            exit 1
          fi
          if [[ -n "$CERTIFICATE_CHAIN" && -z "$PRIVATE_KEY" || -z "$CERTIFICATE_CHAIN" && -n "$PRIVATE_KEY" ]]; then
            echo '::error::Plugin signing needs both CERTIFICATE_CHAIN and PRIVATE_KEY, or neither.'
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify release version
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./gradlew --no-daemon verifyReleaseVersion

      - name: Test, build, and verify plugin
        run: ./gradlew --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin

      - name: Save verified plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helmfile-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Publish to JetBrains Marketplace
        if: inputs.release_tag != ''
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          MARKETPLACE_CHANNEL: ${{ inputs.marketplace_channel }}
        run: |
          publish_tasks=(publishPlugin)
          if [[ -n "$PRIVATE_KEY" ]]; then
            publish_tasks=(verifyPluginSignature publishPlugin)
          fi
          ./gradlew --no-daemon --no-configuration-cache "${publish_tasks[@]}" -PmarketplaceChannel="$MARKETPLACE_CHANNEL"

      - name: Save test and verifier reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/pluginVerifier/
          if-no-files-found: ignore
