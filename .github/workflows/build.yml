name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Check Conventional Commits
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$COMMIT_BASE" || "$COMMIT_BASE" =~ ^0+$ ]]; then
            COMMIT_BASE="$(git describe --tags --abbrev=0)"
          fi
          npm run lint:commits -- --from "$COMMIT_BASE" --to HEAD --verbose

      - name: Test release tooling
        run: npm test

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test, build, and verify plugin
        run: ./gradlew --no-daemon test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin

      - name: Save verified plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helmfile-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Save test and verifier reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/pluginVerifier/
          if-no-files-found: ignore
